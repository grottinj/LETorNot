<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" role="img" aria-labelledby="graft-sites-t graft-sites-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="graft-sites-t">Where each graft comes from</title>
  <desc id="graft-sites-d">Front view of a right knee with the kneecap, the thigh muscle and the tendons shown. Three places a graft can be taken from are colored. Purple: a strip from the middle of the quadriceps tendon, just above the kneecap. Orange: the middle third of the patellar tendon, between the kneecap and the shin bone, with a small plug of bone at each end. Teal: two hamstring tendons that run down the inner back of the thigh and curve forward to attach on the inner side of the shin bone.</desc>

  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dccaa4"/>
      <stop offset="0.28" stop-color="#f3e9d2"/>
      <stop offset="0.62" stop-color="#f7efdc"/>
      <stop offset="1" stop-color="#d9c69d"/>
    </linearGradient>
    <linearGradient id="boneV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6eedb"/>
      <stop offset="1" stop-color="#dfcfab"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fb"/>
      <stop offset="1" stop-color="#d5e0e7"/>
    </linearGradient>
    <linearGradient id="lig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3c6"/>
      <stop offset="0.5" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#d2ccbe"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b54a13"/>
      <stop offset="0.5" stop-color="#e07a42"/>
      <stop offset="1" stop-color="#b54a13"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#125a5a"/>
      <stop offset="0.5" stop-color="#3f9a98"/>
      <stop offset="1" stop-color="#125a5a"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43408f"/>
      <stop offset="0.5" stop-color="#7b78c9"/>
      <stop offset="1" stop-color="#43408f"/>
    </linearGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9645c"/>
      <stop offset="0.5" stop-color="#d98d82"/>
      <stop offset="1" stop-color="#b9645c"/>
    </linearGradient>
    <linearGradient id="menis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd3cb"/>
      <stop offset="1" stop-color="#cfa79c"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8d7868"/>
      <stop offset="1" stop-color="#5e4f45"/>
    </radialGradient>
    <pattern id="spongy" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.3" fill="#c9b58c" opacity="0.55"/>
      <circle cx="10" cy="10" r="1.1" fill="#c9b58c" opacity="0.45"/>
    </pattern>
  </defs>

