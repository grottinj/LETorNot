<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-labelledby="acl-torn-t acl-torn-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="acl-torn-t">Torn ACL</title>
  <desc id="acl-torn-d">The same front view of a right knee. The ACL is torn in the middle, leaving one frayed orange stump attached to the thigh bone and another attached to the shin bone. The two ends no longer connect.</desc>

  <defs>
