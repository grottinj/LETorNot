      <stop offset="0.5" stop-color="#e07a42"/>
      <stop offset="1" stop-color="#b54a13"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#125a5a"/>
      <stop offset="0.5" stop-color="#3f9a98"/>
      <stop offset="1" stop-color="#125a5a"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43408f"/>
      <stop offset="0.5" stop-color="#7b78c9"/>
      <stop offset="1" stop-color="#43408f"/>
    </linearGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9645c"/>
      <stop offset="0.5" stop-color="#d98d82"/>
      <stop offset="1" stop-color="#b9645c"/>
    </linearGradient>
    <linearGradient id="menis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd3cb"/>
      <stop offset="1" stop-color="#cfa79c"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8d7868"/>
      <stop offset="1" stop-color="#5e4f45"/>
    </radialGradient>
    <pattern id="spongy" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.3" fill="#c9b58c" opacity="0.55"/>
      <circle cx="10" cy="10" r="1.1" fill="#c9b58c" opacity="0.45"/>
    </pattern>
  </defs>

