<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-labelledby="let-before-t let-before-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="let-before-t">Before the LET: where the strip comes from</title>
  <desc id="let-before-d">Outer-side view of a right knee, with the kneecap on the right of the picture. The thigh bone is at the top, the shin bone and fibula are below. The iliotibial band, a wide flat band shown see-through, runs down the outer thigh, crosses the knee and attaches to a bump on the front-outer shin bone called Gerdy's tubercle. A dashed orange outline marks the thin strip of the band that the surgeon will use. The fibular collateral ligament runs from the outer bump of the thigh bone down to the top of the fibula.</desc>

  <defs>
